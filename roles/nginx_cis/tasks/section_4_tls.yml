---
- name: Create pre-Section-4 NGINX backup
  ansible.builtin.command:
    cmd: tar -czf /root/nginx-pre-cis-section4.tar.gz /etc/nginx
    creates: /root/nginx-pre-cis-section4.tar.gz
  tags:
    - cis_section_4

- name: "CIS Section 4 | Ensure OpenSSL is installed"
  ansible.builtin.apt:
    name: openssl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - cis_section_4
    - cis_tls_material

- name: "CIS 4.1.3 | Create protected TLS directory"
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - cis_section_4
    - cis_4_1_3
    - cis_tls_material

- name: "CIS Section 4 | Check TLS private key"
  ansible.builtin.stat:
    path: "{{ nginx_cis_tls_private_key }}"
  register: enterprise-lab_tls_key
  tags:
    - cis_section_4
    - cis_4_1_3
    - cis_tls_material

- name: "CIS Section 4 | Check TLS certificate"
  ansible.builtin.stat:
    path: "{{ nginx_cis_tls_certificate }}"
  register: enterprise-lab_tls_certificate
  tags:
    - cis_section_4
    - cis_tls_material

# This creates a self-signed laboratory certificate.
# It does not satisfy CIS 4.1.2, which requires a trusted certificate chain.
- name: "CIS Section 4 | Generate laboratory TLS certificate and private key"
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -sha256
      - -days
      - "{{ nginx_cis_tls_certificate_days | string }}"
      - -subj
      - "/CN={{ nginx_cis_primary_name }}"
      - -addext
      - "subjectAltName=DNS:{{ nginx_cis_primary_name }},DNS:web01,IP:{{ nginx_cis_private_ip }}"
      - -keyout
      - "{{ nginx_cis_tls_private_key }}"
      - -out
      - "{{ nginx_cis_tls_certificate }}"
  when:
    - not enterprise-lab_tls_key.stat.exists or not enterprise-lab_tls_certificate.stat.exists
  tags:
    - cis_section_4
    - cis_4_1_3
    - cis_tls_material

- name: "CIS 4.1.3 | Restrict TLS private-key permissions"
  ansible.builtin.file:
    path: "{{ nginx_cis_tls_private_key }}"
    state: file
    owner: root
    group: root
    mode: "0400"
  tags:
    - cis_section_4
    - cis_4_1_3
    - cis_tls_material

- name: "CIS Section 4 | Protect TLS certificate"
  ansible.builtin.file:
    path: "{{ nginx_cis_tls_certificate }}"
    state: file
    owner: root
    group: root
    mode: "0640"
  tags:
    - cis_section_4
    - cis_tls_material

# TLS protocol configuration is maintained in the cumulative site template.
# Remove Ubuntu's global ssl_protocols directive to prevent duplicate output.
- name: "CIS 4.1.4 | Remove competing global TLS protocol directive"
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^[[:space:]]*ssl_protocols[[:space:]]+'
    state: absent
    backup: true
  notify: Validate and reload NGINX
  tags:
    - cis_section_4
    - cis_4_1_4
    - cis_4_1_5
