---
- name: Create pre-Section-3 NGINX backup
  ansible.builtin.command:
    cmd: tar -czf /root/nginx-pre-cis-section3.tar.gz /etc/nginx
    creates: /root/nginx-pre-cis-section3.tar.gz
  tags:
    - cis_section_3

- name: "CIS 3.1 and 3.2 | Configure detailed JSON access logging"
  ansible.builtin.template:
    src: cis-logging.conf.j2
    dest: /etc/nginx/conf.d/10-cis-logging.conf
    owner: root
    group: root
    mode: "0640"
  notify: Validate and reload NGINX
  tags:
    - cis_section_3
    - cis_3_1
    - cis_3_2

- name: CIS 3.2 | Secure JSON access log permissions
  ansible.builtin.file:
    path: /var/log/nginx/access.json
    state: touch
    owner: www-data
    group: adm
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  become: true
  tags:
    - cis_section_3
    - cis_3_2

- name: "CIS 3.3 | Enable error logging at info level"
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*error_log\s+'
    line: 'error_log /var/log/nginx/error.log info;'
    insertbefore: '^\s*events\s*\{'
    backup: true
  notify: Validate and reload NGINX
  tags:
    - cis_section_3
    - cis_3_3

